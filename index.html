.btn.wa{background:#1f8a4c;color:#fff}

.sec-h b{font-size:17px}.sec-h div{font-size:13.5px;color:#d9ca9b}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.q.bad{border-color:var(--err)}
.q label.l{display:block;font-weight:600;margin-bottom:6px}
.q .req{color:var(--err)}.hint{font-size:13px;color:var(--muted);margin:-2px 0 6px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--soft)}.opt input{margin-top:7px;accent-color:#0b3b2c;width:18px;height:18px;flex:none}

.scale button{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.scale button.on{background:#0b3b2c;color:#f6edd2}
.sl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}

.alert.show{display:block}
.note{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.res textarea{min-height:240px;font-size:14px;direction:rtl}
.back{background:none;border:0;color:var(--green);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
a{color:var(--green)}

const app=document.getElementById('app');
let current=null, ans={}, bad=new Set();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function baseUrl(){return location.href.split('#')[0]}
function route(){const id=(location.hash||'').replace('#','');const f=FORMS.find(x=>x.id===id);if(f){openForm(f)}else{home()}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
function head(){return `<div class="brand"><div class="en">MASTERMIND ACADEMY</div><h1>أكاديمية ماستر مايند</h1><p>كوتش زهيد عادل — معاً .. نحو نسخة أفضل من نفسك</p></div>`}
function home(){current=null;
 app.innerHTML=head()+`<img class="hero" src="${IMG}" alt="">`+
 `<div class="note">اختار الاستمارة المناسبة. إجاباتك ما كتتخزنش فأي سيرفر، وغادي تتبعت لكوتش زهيد غير ملي تضغط على «إرسال».</div><div class="grid">`+
 FORMS.map(f=>`<div class="card"><div class="meta">${esc(f.time)} • ${f.sections.reduce((n,s)=>n+s.qs.length,0)} سؤال</div><h2>${esc(f.title)}</h2><div class="sub">${esc(f.sub)}</div><div class="row"><a class="btn pri" href="#${f.id}">فتح الاستمارة</a><button class="btn sec" data-link="${f.id}">نسخ الرابط</button></div></div>`).join('')+`</div>`;
 app.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>copy(baseUrl()+'#'+b.dataset.link,b));
}
function copy(t,btn){const done=()=>{if(btn){const o=btn.textContent;btn.textContent='تم النسخ';setTimeout(()=>btn.textContent=o,1500)}};
 try{navigator.clipboard.writeText(t).then(done,()=>fallback(t,done))}catch(e){fallback(t,done)}}
function fallback(t,done){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
function qHtml(q){
 const r=q.req?'<span class="req"> *</span>':'';let inner='';
 if(q.t==='text')inner=`<input type="text" data-id="${q.id}" autocomplete="off">`;
 else if(q.t==='long')inner=`<textarea data-id="${q.id}"></textarea>`;
 else if(q.t==='select')inner=`<select data-id="${q.id}"><option value="">اختار…</option>${q.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
 else if(q.t==='radio')inner=q.o.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${esc(o)}" data-id="${q.id}"><span>${esc(o)}</span></label>`).join('');
 else if(q.t==='check')inner=q.o.map(o=>`<label class="opt"><input type="checkbox" value="${esc(o)}" data-id="${q.id}"><span>${esc(o)}</span></label>`).join('');
 else if(q.t==='consent')inner=`<label class="opt"><input type="checkbox" data-id="${q.id}" data-consent="1"><span>${esc(q.q)}</span></label>`;
 else if(q.t==='scale'){let b='';for(let i=q.min;i<=q.max;i++)b+=`<button type="button" data-sc="${q.id}" data-v="${i}">${i}</button>`;inner=`<div class="scale">${b}</div><div class="sl"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`}
 const lab=q.t==='consent'?'':`<label class="l">${esc(q.q)}${r}</label>`;
 const alert=q.id==='s_self'?`<div class="alert" id="al_self"><b>شكرا على صراحتك.</b> إلا كنتي كتفكر فإيذاء راسك، سلامتك هي الأولوية: تواصل دابا مع شخص كتثق فيه، أو مع خدمات الطوارئ فبلادك، أو مع مختص نفسي. ما تبقاش وحدك. وقدر تبعت لنا هاد الاستمارة باش نوجهوك.</div>`:'';
 return `<div class="q" id="q_${q.id}">${lab}${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}${inner}${alert}</div>`}
function openForm(f){current=f;ans={};bad=new Set();
 let total=0;
 app.innerHTML=head()+`<button class="back" onclick="location.hash=''">← كل الاستمارات</button><div class="card"><h2>${esc(f.title)}</h2><div class="sub">${esc(f.sub)} • ${esc(f.time)}</div></div><div class="prog"><i id="pb"></i></div>`+
 f.sections.map(s=>`<div class="sec-h"><b>${esc(s.title)}</b>${s.desc?`<div>${esc(s.desc)}</div>`:''}</div>`+s.qs.map(q=>{total++;return qHtml(q)}).join('')).join('')+
 `<div class="note">إجاباتك ما كتتخزنش فأي سيرفر. غادي تتبعت غير ملي تختار «إرسال» فالخطوة الجاية.</div><div class="row"><button class="btn pri" id="go">متابعة وإرسال</button></div><div id="out"></div>`;
 app.querySelectorAll('[data-id]').forEach(el=>{el.addEventListener('input',()=>collect(f));el.addEventListener('change',()=>collect(f))});
 app.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{const id=b.dataset.sc;ans[id]=b.dataset.v;app.querySelectorAll(`[data-sc="${id}"]`).forEach(x=>x.classList.toggle('on',x===b));progress(f);clearBad(id)});
 document.getElementById('go').onclick=()=>submit(f);
}
function collect(f){f.sections.forEach(s=>s.qs.forEach(q=>{
 if(q.t==='text'||q.t==='long'||q.t==='select'){const el=app.querySelector(`[data-id="${q.id}"]`);ans[q.id]=el.value.trim()}
 else if(q.t==='radio'){const el=app.querySelector(`[name="${q.id}"]:checked`);ans[q.id]=el?el.value:''}
 else if(q.t==='check'){ans[q.id]=[...app.querySelectorAll(`[data-id="${q.id}"]:checked`)].map(x=>x.value)}
 else if(q.t==='consent'){ans[q.id]=app.querySelector(`[data-id="${q.id}"]`).checked}
}));
 const a=document.getElementById('al_self');if(a)a.classList.toggle('show',ans.s_self==='نعم');
 progress(f);bad.forEach(id=>{if(filled(f,id))clearBad(id)})}
function filled(f,id){const v=ans[id];return Array.isArray(v)?v.length>0:(v===true||(v!==undefined&&v!==''&&v!==false))}
function clearBad(id){bad.delete(id);const e=document.getElementById('q_'+id);if(e)e.classList.remove('bad')}
function progress(f){const qs=f.sections.flatMap(s=>s.qs);const n=qs.filter(q=>filled(f,q.id)).length;document.getElementById('pb').style.width=Math.round(100*n/qs.length)+'%'}
function submit(f){collect(f);bad=new Set();
 f.sections.forEach(s=>s.qs.forEach(q=>{if(q.req&&!filled(f,q.id))bad.add(q.id)}));
 app.querySelectorAll('.q').forEach(e=>e.classList.remove('bad'));
 if(bad.size){bad.forEach(id=>document.getElementById('q_'+id).classList.add('bad'));const first=document.getElementById('q_'+[...bad][0]);first.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('out').innerHTML=`<div class="note" style="border:1.5px solid var(--err)">كاينين أسئلة إجبارية ما تجاوبوش (باللون الأحمر). عمّرهم وعاود.</div>`;return}
 const txt=summary(f);const wa=`https://wa.me/${WA}?text=`+encodeURIComponent(txt);
 const mail=`mailto:${MAIL}?subject=`+encodeURIComponent(f.title+' — '+(ans.name||''))+`&body=`+encodeURIComponent(txt);
 document.getElementById('out').innerHTML=`<div class="card res" style="margin-top:14px"><h2>جاهزة للإرسال</h2><div class="sub">راجع إجاباتك، ومن بعد اختار طريقة الإرسال.</div><textarea readonly id="sum">${esc(txt)}</textarea>
 <div class="row"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">إرسال عبر واتساب</a><a class="btn sec" href="${mail}">إرسال بالإيميل</a><button class="btn sec" id="cp">نسخ الإجابات</button></div>
 <div class="note">إلا ما تحلش الواتساب، انسخ الإجابات وصيفطها لكوتش زهيد ({PHONE}).</div></div>`.replace('{PHONE}','0665112789');
 document.getElementById('cp').onclick=e=>copy(txt,e.target);document.getElementById('out').scrollIntoView({behavior:'smooth'})}
function fmt(q){const v=ans[q.id];if(q.t==='scale')return v===undefined?'—':v+'/'+q.max;if(q.t==='consent')return v?'موافق':'—';if(Array.isArray(v))return v.length?v.join('، '):'—';return v||'—'}
function summary(f){const d=new Date().toLocaleDateString('fr-MA');let t=`استمارة: ${f.title}\nأكاديمية ماستر مايند\nالتاريخ: ${d}\n`;
 const flags=[];if(ans.s_self==='نعم')flags.push('أفكار إيذاء النفس');['s_epi','s_panic','s_psy'].forEach(k=>{if(ans[k]==='نعم')flags.push(k)});
 if(flags.length)t+=`\n[تنبيه سلامة: ${flags.join(' / ')}]\n`;
 f.sections.forEach(s=>{t+=`\n— ${s.title} —\n`;s.qs.forEach(q=>{if(q.t==='consent'){t+=`• الموافقة: ${fmt(q)}\n`}else{t+=`• ${q.q}\n  ${fmt(q)}\n`}})});return t}
route();
</script></body></html>
